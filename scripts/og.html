<!DOCTYPE html>
<!--
  Social share card template (1200x630) for peoperator.co.
  Rendered to /og.png by scripts/make_og.py (headless Chrome). Paths are
  relative to the repo root, which make_og.py serves over a local HTTP server.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>og card</title>
<style>
  @font-face {
    font-family: "Archivo";
    font-style: normal;
    font-weight: 100 900;
    font-stretch: 62% 125%;
    src: url("/fonts/archivo-latin-var.woff2") format("woff2");
  }
  :root {
    --ground: #2d2e26;
    --ground-deep: #23241d;
    --rule: #4f5045;
    --text: #f3f1e7;
    --text-muted: #c4c2b2;
    --bolt-yellow: #eeb937;
    --safe: 60px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px; overflow: hidden;
    background: var(--ground);
    font-family: "Archivo", sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .card { position: relative; width: 1200px; height: 630px; }
  .band {
    position: absolute; left: 0; top: 0; width: 1200px; height: 226px;
    overflow: hidden;
    border-bottom: 6px solid var(--bolt-yellow);
  }
  .band img {
    display: block; width: 1200px; height: 220px;
    object-fit: cover; object-position: left 45%;
  }
  .copy {
    position: absolute;
    left: var(--safe); right: var(--safe);
    top: 256px; bottom: var(--safe);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  h1 {
    font-weight: 800;
    font-stretch: 72%;
    font-size: 112px;
    line-height: 0.92;
    letter-spacing: -0.02em;
    color: var(--text);
  }
  /* Title + tagline sit high: X overlays the page title on the bottom-left of
     large cards, so the bottom-left ~90px is kept free of text. */
  .tagline {
    margin-top: 18px;
    font-size: 36px; font-weight: 450; line-height: 1.2;
    color: var(--text-muted);
  }
  .site {
    align-self: flex-end;
    display: flex; align-items: center; gap: 10px;
    font-size: 28px; font-weight: 650; font-stretch: 112%;
    letter-spacing: 0.02em;
    color: var(--bolt-yellow);
    white-space: nowrap;
  }
  .site svg { width: 30px; height: 30px; flex: none; }
</style>
</head>
<body>
<div class="card">
  <div class="band"><img src="/Untitled.jpg" alt=""></div>
  <div class="copy">
    <div class="lead">
      <h1>PE Operator's Book<br>Recommendations</h1>
      <p class="tagline">Books that actually changed how I think</p>
    </div>
    <p class="site"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.2 1.8 4.6 13.6h6.1l-1.6 8.6 9.9-12.4h-6.3l1.5-8z" fill="currentColor"/></svg>peoperator.co</p>
  </div>
</div>
</body>
</html>
